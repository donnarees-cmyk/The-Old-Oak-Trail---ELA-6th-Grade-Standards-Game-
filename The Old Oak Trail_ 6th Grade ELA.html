<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Old Oak Trail: 6th Grade ELA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEAFF; --card:#FFFFFF; --ink:#1D1A3A; --muted:#51507A; --edge:#1D1A3A; --navy:#1D1A3A;
  --c1:#7ED957; --c2:#4DB6FF; --c3:#FF7A7A; --c4:#B496FF; --c5:#FFC83D; --c6:#3DD6C3; --c7:#FF9F43; --c8:#FF8FC7;
  --btn:#6B3FD6; --btn-ink:#FFFFFF; --btn-low:#3E2090;
  --ok:#0E7A3B; --okbg:#C8F5D3; --bad:#B3261E; --badbg:#FFD9D6; --sel:#FFF3B8; --chip:#F7F4FF; --line:#CFC6F5;
  --hard:5px 5px 0 var(--edge);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#14122B; --card:#221F47; --ink:#F1EEFF; --muted:#B7B3E0; --edge:#8A83D9;
    --btn:#8F6BFF; --btn-ink:#10092B; --btn-low:#5A3DB8;
    --ok:#8CF0B0; --okbg:#1E4D33; --bad:#FF9C94; --badbg:#5A2323; --sel:#4D4318; --chip:#2B2858; --line:#3F3A78;
    --hard:5px 5px 0 #0A0818; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#14122B; --card:#221F47; --ink:#F1EEFF; --muted:#B7B3E0; --edge:#8A83D9;
  --btn:#8F6BFF; --btn-ink:#10092B; --btn-low:#5A3DB8;
  --ok:#8CF0B0; --okbg:#1E4D33; --bad:#FF9C94; --badbg:#5A2323; --sel:#4D4318; --chip:#2B2858; --line:#3F3A78;
  --hard:5px 5px 0 #0A0818; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  background-image:radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--edge) 14%,transparent) 1.5px,transparent 0);background-size:26px 26px;
  font-family:"Atkinson Hyperlegible","Trebuchet MS",Verdana,system-ui,sans-serif;font-size:19px;line-height:1.5}
h1,h2,h3{font-family:Fredoka,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-weight:600;line-height:1.15;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--c5);outline-offset:2px;box-shadow:0 0 0 7px var(--navy)}
.wrap{max-width:880px;margin:0 auto;padding:0 16px}

/* top bar + rainbow progress */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{font-family:Fredoka,"Trebuchet MS",sans-serif;font-weight:600;font-size:1.3rem;margin-right:auto}
.pill{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:.92rem;white-space:nowrap}
.pill select{background:transparent;border:0;color:inherit;font-weight:700}
.pill select option{color:#1D1A3A}
.pill.xp{background:var(--c5);color:#1D1A3A;font-weight:700}
#saved{font-size:.85rem}
.prog{height:8px;background:rgba(255,255,255,.2)}
#progfill{height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2),var(--c3),var(--c4),var(--c5));transition:width .5s}

/* trail */
.trail{display:flex;gap:8px;overflow-x:auto;padding:16px 4px 10px;list-style:none;margin:0}
.trail li{flex:1 0 auto}
.stop{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:80px;padding:8px 6px;background:var(--tc,var(--card));color:#1D1A3A;
  border:3px solid var(--edge);border-radius:16px;font-size:.84rem;font-weight:700;opacity:.78}
.stop .ic{font-size:1.5rem;line-height:1}
.stop.here{opacity:1;transform:translateY(-3px);box-shadow:0 5px 0 var(--edge)}
.stop.done .ic::after{content:" ✓";font-size:.95rem}
.stop:disabled{opacity:.4;cursor:default}

/* cards */
main{padding-bottom:120px}
.card{background:var(--card);border:3px solid var(--edge);border-radius:22px;padding:18px;margin:18px 0;box-shadow:var(--hard)}
.banner{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--tc,var(--c5));color:#1D1A3A;border:3px solid var(--edge);border-radius:24px;padding:14px 18px;margin-top:14px;box-shadow:var(--hard)}
.banner h2{font-size:1.75rem}
.bigic{font-size:2.8rem;line-height:1}
.time{background:#fff;color:#1D1A3A;border:2px solid #1D1A3A;border-radius:999px;padding:2px 12px;font-size:.9rem;font-weight:700;margin-left:auto}
.lead{display:flex;gap:10px;align-items:flex-start}
.lead p{margin:0;flex:1}
.hp{background:var(--sel);border:2px dashed var(--edge);border-radius:14px;padding:8px 12px;font-size:.95rem;margin:12px 0 0}

.spk{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--edge);background:var(--c5);color:#1D1A3A;font-size:1.15rem;line-height:1;display:inline-grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--edge)}
.spk:active{transform:translateY(3px);box-shadow:none}
.spk.reading{background:var(--c1);animation:pulse 1s infinite}
.spk.sm{width:38px;height:38px;font-size:1rem}
@keyframes pulse{50%{box-shadow:0 3px 0 var(--edge),0 0 0 7px color-mix(in srgb,var(--c1) 45%,transparent)}}
body.nospeech .spk{display:none}

.q{border-top:3px dotted var(--line);padding-top:16px;margin-top:16px}
.q:first-child{border-top:0;margin-top:0;padding-top:0}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qtext{margin:0;flex:1;font-weight:700}
.tag{display:inline-block;font-size:.78rem;font-weight:700;background:var(--tc,var(--c2));color:#1D1A3A;border:2px solid var(--edge);border-radius:999px;padding:0 10px;margin-right:8px}
.opts{display:grid;gap:10px;margin-top:12px}
.orow{display:flex;gap:8px;align-items:stretch}
.opt{flex:1;text-align:left;min-height:54px;padding:10px 16px;border:3px solid var(--edge);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--edge);transition:transform .08s}
.opt:hover:not(:disabled){background:var(--sel)}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.opt.right{background:var(--okbg);border-color:var(--ok);box-shadow:0 4px 0 var(--ok)}
.opt.on{background:var(--c5);color:#1D1A3A}
.opt.wrong{background:var(--badbg);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{display:flex;gap:10px;align-items:flex-start;margin-top:12px;border-radius:16px;padding:10px 14px;border:3px solid}
.fb p{margin:0;flex:1}
.fb.ok{background:var(--okbg);border-color:var(--ok)} .fb.no{background:var(--badbg);border-color:var(--bad)}
.cheer{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.15rem;margin-right:6px}

/* poem / ads / ref */
.poem{border-left:8px solid var(--c2);padding:4px 0 4px 16px;font-style:italic;font-size:1.14rem;background:linear-gradient(90deg,color-mix(in srgb,var(--c2) 14%,transparent),transparent)}
.stanza{display:flex;gap:10px;align-items:flex-start;margin:10px 0}
.stanza p{margin:0;flex:1}
.ptitle{font-family:Fredoka,sans-serif;font-weight:600;font-size:1.4rem}
.adgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin:18px 0}
.ad{border:3px solid var(--edge);border-radius:20px;padding:14px;box-shadow:var(--hard);color:#1D1A3A}
.ad:nth-child(1){background:#FFE29A} .ad:nth-child(2){background:#BFE6FF}
.ad h3{font-size:1.1rem}
.ad p{margin:0 0 6px}
.reftable{width:100%;border-collapse:collapse}
.reftable td,.reftable th{padding:6px 8px;border-bottom:2px solid var(--line);text-align:left}
.reftable th{font-size:.85rem;color:var(--muted)}
.reftable td:first-child{font-weight:700;font-family:Fredoka,sans-serif;font-size:1.1rem}

/* drag */
.pool,.zone{border:3px dashed var(--edge);border-radius:18px;padding:10px;min-height:68px}
.pool{background:var(--chip);display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.zones{display:grid;gap:12px;margin-top:14px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.zone{background:var(--card)}
.zone .zlabel{display:flex;gap:8px;align-items:center;font-weight:700;font-size:.95rem;margin-bottom:8px}
.zone .zlabel span{flex:1}
.zdrop{display:flex;flex-direction:column;gap:8px;min-height:52px}
.zone.hot,.pool.hot{border-style:solid;background:var(--sel);transform:scale(1.01)}
.chip{display:flex;align-items:center;gap:6px;background:var(--tc,var(--c5));color:#1D1A3A;border:3px solid var(--edge);border-radius:14px;padding:6px 6px 6px 12px;
  touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;font-size:.98rem;font-weight:700;box-shadow:0 4px 0 var(--edge)}
.chip span{flex:1}
.chip .spk{box-shadow:none;background:#fff}
.chip.sel{outline:4px solid #fff;box-shadow:0 0 0 7px var(--navy);transform:translateY(-3px) rotate(-1deg)}
.chip.dragging{opacity:.3}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ink)}
.chip.bad{background:var(--badbg);border-color:var(--bad);color:var(--ink)}
.ghost{position:fixed;z-index:999;pointer-events:none;transform:translate(-50%,-50%) rotate(-4deg) scale(1.05);box-shadow:0 12px 24px rgba(0,0,0,.35);max-width:80vw}
.hintline{font-size:.92rem;color:var(--muted);margin:8px 0 0}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{min-height:54px;padding:8px 22px;border-radius:16px;border:3px solid var(--edge);background:var(--btn);color:var(--btn-ink);font-weight:700;box-shadow:0 5px 0 var(--btn-low);transition:transform .08s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:none}
.btn.alt{background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--edge)}
.btn:disabled{opacity:.45;cursor:default}
.result{font-weight:700}

/* write */
.field{margin-top:14px}
.field label{display:flex;gap:10px;align-items:flex-start;font-weight:700}
.field label span{flex:1}
textarea,input[type=text]{width:100%;margin-top:6px;padding:10px 14px;border:3px solid var(--edge);border-radius:16px;background:var(--chip);resize:vertical}
textarea:focus,input[type=text]:focus{background:var(--card);outline:4px solid var(--c2);outline-offset:0}
.count{font-size:.85rem;color:var(--muted);text-align:right}
.badge{display:inline-block;background:var(--c3);color:#1D1A3A;border:2px solid var(--edge);border-radius:999px;padding:0 10px;font-size:.78rem;font-weight:700;margin-right:8px}
.rate{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.rate button{min-width:64px;min-height:58px;border-radius:16px;border:3px solid var(--edge);background:var(--card);font-weight:700;box-shadow:0 4px 0 var(--edge)}
.rate button.on{background:var(--c5);color:#1D1A3A}

/* bottom nav */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:3px solid var(--edge);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.bar .wrap{display:flex;gap:12px;justify-content:space-between}

/* start / results */
.hero{margin-top:14px;background:var(--c4);color:#1D1A3A;border:3px solid var(--edge);border-radius:28px;padding:22px 22px 24px;box-shadow:var(--hard)}
.hero h1{font-size:2.6rem}
.hero .emo{font-size:2.2rem;letter-spacing:.15em}
.hero p{max-width:58ch;margin:8px 0 0}
.big{font-family:Fredoka,sans-serif;font-size:3.4rem;line-height:1}
.rank{font-family:Fredoka,sans-serif;font-size:1.5rem;font-weight:600}
.medals{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.medal{display:flex;align-items:center;gap:6px;border:3px solid var(--edge);border-radius:999px;padding:4px 14px 4px 8px;font-weight:700;color:#1D1A3A;box-shadow:0 3px 0 var(--edge)}
.medal.off{background:var(--chip);color:var(--muted);border-style:dashed;box-shadow:none}
.rtable{width:100%;border-collapse:collapse;margin-top:10px}
.rtable td{padding:8px;border-bottom:2px solid var(--line)}
.rtable td:last-child{text-align:right;font-weight:700}
.answer{white-space:pre-wrap;background:var(--chip);border:2px solid var(--line);border-radius:12px;padding:8px 10px;margin:4px 0 10px}

/* confetti */
.confetti{position:fixed;z-index:1000;pointer-events:none;width:10px;height:14px;border-radius:2px;animation:fall 1.1s ease-out forwards}
@keyframes fall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){.spk.reading{animation:none}.confetti{display:none}#progfill{transition:none}.opt,.btn{transition:none}}

/* bonus rounds */
.gstats{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0 6px;font-weight:700;align-items:center}
.gstats b{font-family:Fredoka,sans-serif;font-size:1.5rem}
.garea{min-height:180px;border:3px dashed var(--edge);border-radius:20px;padding:14px;background:var(--chip);margin-top:8px}
.gprompt{display:flex;gap:10px;align-items:center;margin-bottom:14px;font-weight:700}
.gprompt span{flex:1}
.bubbles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.bubble{min-height:88px;padding:10px 14px;border:3px solid var(--edge);border-radius:40px;font-weight:700;color:#1D1A3A;box-shadow:0 5px 0 var(--edge);animation:bob 3s ease-in-out infinite}
.bubble.b0{background:var(--c1)} .bubble.b1{background:var(--c2)} .bubble.b2{background:var(--c3)} .bubble.b3{background:var(--c4)} .bubble.b4{background:var(--c5)}
@keyframes bob{50%{transform:translateY(-8px)}}
.bubble.popped{animation:pop .3s forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.5);opacity:0}}
.bubble.miss{background:var(--badbg);color:var(--ink);animation:none;opacity:.6;box-shadow:none}
.gcard{background:var(--card);border:3px solid var(--edge);border-radius:22px;box-shadow:var(--hard);padding:20px;font-size:1.3rem;font-weight:700;text-align:center;min-height:120px;display:flex;align-items:center;gap:10px;justify-content:center}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-top:16px}
.choices button{min-height:62px;border:3px solid var(--edge);border-radius:16px;font-weight:700;color:#1D1A3A;box-shadow:0 4px 0 var(--edge)}
.choices .c0{background:var(--c1)} .choices .c1{background:var(--c2)} .choices .c2{background:var(--c3)} .choices .c3{background:var(--c5)}
.choices button:active{transform:translateY(4px);box-shadow:none}
.choices .rightc{outline:5px solid var(--ok)} .choices .wrongc{outline:5px solid var(--bad);opacity:.7}
.gfb{min-height:32px;margin-top:12px;font-weight:700}
.boss{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.bossic{font-size:2.8rem;line-height:1}
.hpbar{height:18px;border:3px solid var(--edge);border-radius:999px;background:var(--card);overflow:hidden;margin-top:4px}
.hpbar div{height:100%;background:var(--c3);transition:width .4s}
.mem{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mcard{min-height:100px;border:3px solid var(--edge);border-radius:16px;padding:8px;font-weight:700;font-size:.95rem;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--c4);color:#1D1A3A;box-shadow:0 4px 0 var(--edge);text-align:center}
button.mcard{font-family:Fredoka,sans-serif;font-size:2rem}
.mcard.up{background:var(--card);color:var(--ink)}
.mcard.done{background:var(--okbg);color:var(--ink);border-color:var(--ok);box-shadow:none}
.mcard span{flex:1}
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot{width:46px;height:58px;border:3px solid var(--edge);border-radius:12px;background:var(--card);display:grid;place-items:center;font-family:Fredoka,sans-serif;font-size:1.7rem;font-weight:600}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tile{width:54px;height:62px;border:3px solid var(--edge);border-radius:12px;background:var(--c5);color:#1D1A3A;font-family:Fredoka,sans-serif;font-size:1.7rem;font-weight:600;box-shadow:0 4px 0 var(--edge)}
.tile:active:not(:disabled){transform:translateY(4px);box-shadow:none}
.tile:disabled{opacity:.25}
.gend{text-align:center;padding:10px}
.btn.go{background:var(--c1);color:#1D1A3A;box-shadow:0 5px 0 var(--edge)}
.brow td:first-child{font-weight:700}
@media (prefers-reduced-motion:reduce){.bubble{animation:none}.hpbar div{transition:none}}

/* front page animation */
.hero.front{position:relative;overflow:hidden;padding-bottom:44px}
.hero.front>*:not(.leaf):not(.runner){position:relative;z-index:1}
.leaf{position:absolute;top:-12%;font-size:1.7rem;pointer-events:none;animation:leaf 9s linear infinite}
@keyframes leaf{0%{top:-14%;transform:translateX(0) rotate(0)}50%{transform:translateX(30px) rotate(200deg)}100%{top:108%;transform:translateX(-12px) rotate(380deg)}}
.runner{position:absolute;bottom:6px;font-size:1.9rem;pointer-events:none;animation:run 11s linear infinite,hop .5s ease-in-out infinite}
@keyframes run{from{left:106%}to{left:-12%}}
@keyframes hop{50%{margin-bottom:10px}}
.ttl .w{display:inline-block;white-space:nowrap;margin-right:.28em}
.ttl .l{display:inline-block;animation:popin .7s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{transform:translateY(34px) scale(.3) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.emo span{display:inline-block;margin-right:.3em;animation:bounce 1.7s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px) rotate(8deg)}}
.btn.pulse{animation:pulse2 1.9s ease-in-out infinite}
@keyframes pulse2{50%{transform:scale(1.06)}}
@media (prefers-reduced-motion:reduce){.leaf,.runner{display:none}.ttl .l,.emo span,.btn.pulse{animation:none}}
@media print{
  .top,.bar,.trail,.noprint,.spk{display:none !important}
  body{background:#fff;color:#000;font-size:14px}
  .card,.hero,.banner{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">🌳 The Old Oak Trail</div>
    <label class="pill" id="ratepill">🔊 Speed
      <select id="rate" aria-label="Reading speed">
        <option value="0.7">Slow</option>
        <option value="0.9" selected>Normal</option>
        <option value="1.1">Fast</option>
      </select>
    </label>
    <div class="pill xp" id="xp" hidden>⭐ <span id="xpn">0</span> XP</div>
    <div class="pill" id="saved" hidden>💾 Saved</div>
  </div>
  <div class="prog"><div id="progfill"></div></div>
</header>
<div class="wrap">
  <ol class="trail" id="trail" aria-label="Your trail"></ol>
  <main id="stage" aria-live="polite"></main>
</div>
<nav class="bar noprint" id="bar" hidden>
  <div class="wrap">
    <button class="btn alt" data-act="back" id="backBtn">Back</button>
    <button class="btn" data-act="next" id="nextBtn">Next</button>
  </div>
</nav>

<script>
(function(){
"use strict";
var KEY="oakTrail-v1";

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function spk(text,cls){return '<button type="button" class="spk '+(cls||'')+'" data-say="'+esc(text)+'" aria-label="Read aloud">🔊</button>';}
function words(s){var t=(s||"").trim();return t?t.split(/\s+/).length:0;}

/* ---------- state ---------- */
var S=load()||{name:"",period:"",started:0,task:-1,items:{},writes:{}};
var lsOK=true,idb=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function save(){
  S.ts=Date.now();
  var okLS=true;
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){okLS=false;}
  lsOK=okLS;
  idbSave();
  showSaved();
}
function showSaved(){
  var el=$("#saved");if(!el)return;
  if(lsOK||idb){el.textContent="💾 Saved";}
  else{el.textContent="⚠️ Not saving. Screenshot your work.";}
}
function idbSave(){
  if(!idb)return;
  try{idb.transaction("s","readwrite").objectStore("s").put(JSON.stringify(S),KEY);}catch(e){}
}
function bootStorage(){
  /* second copy of the work in IndexedDB; if it is newer than the first copy, use it */
  try{
    var r=indexedDB.open("oakTrail",1);
    r.onupgradeneeded=function(){r.result.createObjectStore("s");};
    r.onsuccess=function(){
      idb=r.result;
      try{
        var g=idb.transaction("s","readonly").objectStore("s").get(KEY);
        g.onsuccess=function(){
          var other=null;try{other=g.result?JSON.parse(g.result):null;}catch(e){}
          if(other&&(other.ts||0)>(S.ts||0)){S=other;render(true);}
          else{idbSave();}
          showSaved();
        };
      }catch(e){}
    };
  }catch(e){}
  window.addEventListener("pagehide",function(){save();});
  document.addEventListener("visibilitychange",function(){if(document.hidden)save();});
}

function autoItems(t){return t.blocks.filter(function(b){return b.type==="mc"||b.type==="drag";});}
function maxOf(b){return b.type==="mc"?1:b.chips.length;}
function ptsOf(b){var st=S.items[b.id]||{};if(b.type==="mc")return st.pick===b.ans?1:0;return st.checked?(st.score||0):0;}
function doneOf(b){var st=S.items[b.id]||{};return b.type==="mc"?st.pick!==undefined:!!st.checked;}
function taskDone(t){return autoItems(t).every(doneOf);}

/* ---------- speech ---------- */
var hasTTS="speechSynthesis" in window&&"SpeechSynthesisUtterance" in window;
var currentBtn=null,currentU=null;
function clearReading(){if(currentBtn)currentBtn.classList.remove("reading");currentBtn=null;currentU=null;}
function speak(text,btn){
  if(!hasTTS)return;
  var ss=window.speechSynthesis;
  if(currentBtn&&currentBtn===btn&&ss.speaking){ss.cancel();clearReading();return;}
  ss.cancel();clearReading();
  var u=new SpeechSynthesisUtterance(String(text).replace(/_{2,}/g," blank "));
  u.rate=parseFloat($("#rate").value)||0.9;
  var vs=ss.getVoices()||[];
  var v=vs.filter(function(x){return /^en[-_]US/i.test(x.lang);})[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0];
  if(v){u.voice=v;u.lang=v.lang;}else{u.lang="en-US";}
  currentU=u;currentBtn=btn||null;
  if(btn)btn.classList.add("reading");
  u.onend=u.onerror=function(){if(currentU===u)clearReading();};
  ss.speak(u);
}
if(!hasTTS)document.body.classList.add("nospeech");
if(hasTTS&&window.speechSynthesis.onvoiceschanged!==undefined){window.speechSynthesis.onvoiceschanged=function(){};}

}

function mcInner(b){
  var st=S.items[b.id]||{};
  var locked=st.pick!==undefined;
  var h='<div class="q"><div class="qhead"><p class="qtext"><span class="tag">'+esc(b.kind)+'</span>'+esc(b.q)+'</p>'+spk(b.q+" "+b.opts.join(". "))+'</div><div class="opts">';
  b.opts.forEach(function(o,i){
    var cls="opt";
    if(locked){if(i===b.ans)cls+=" right";else if(i===st.pick)cls+=" wrong";}
    h+='<div class="orow"><button type="button" class="'+cls+'" data-act="mc" data-id="'+b.id+'" data-i="'+i+'"'+(locked?" disabled":"")+'>'+esc(o)+'</button>'+spk(o,"sm")+'</div>';
  });
  h+='</div>';
  if(locked){
    var ok=st.pick===b.ans;
    var ch=cheer(b.id,ok);var msg=ch+" "+b.why;
    h+='<div class="fb '+(ok?"ok":"no")+'"><p><span class="cheer">'+esc(ch)+'</span>'+esc(b.why)+'</p>'+spk(msg,"sm")+'</div>';
  }
  return h+'</div>';
}

function chipHTML(b,c,st){
  var cls="chip";
  if(st.checked&&st.place[c.id]&&st.place[c.id]!=="pool"){cls+=(st.place[c.id]===c.zone?" ok":" bad");}
  if(sel&&sel.item===b.id&&sel.chip===c.id)cls+=" sel";
  return '<div class="'+cls+'" data-chip="'+c.id+'" data-item="'+b.id+'" tabindex="0" role="button" aria-label="Card: '+esc(c.text)+'"><span>'+esc(c.text)+'</span>'+spk(c.text,"sm")+'</div>';
}
function dragInner(b){
  var st=S.items[b.id];
  if(!st){st=S.items[b.id]={place:{},checked:false,score:0};}
  var h='<div class="q"><div class="qhead"><p class="qtext"><span class="tag">Drag and drop</span>'+esc(b.prompt)+'</p>'+spk(b.prompt)+'</div>';
  var poolChips=b.chips.filter(function(c){return !st.place[c.id]||st.place[c.id]==="pool";});
  h+='<div class="pool" data-zone="pool" data-item="'+b.id+'">'+poolChips.map(function(c){return chipHTML(b,c,st);}).join('')+(poolChips.length?'':'<span class="hintline">All cards placed.</span>')+'</div>';
  h+='<div class="zones">';
  b.zones.forEach(function(z){
    var inZ=b.chips.filter(function(c){return st.place[c.id]===z.id;});
    h+='<div class="zone" data-zone="'+z.id+'" data-item="'+b.id+'"><div class="zlabel"><span>'+esc(z.label)+'</span>'+spk(z.label,"sm")+'</div><div class="zdrop">'+inZ.map(function(c){return chipHTML(b,c,st);}).join('')+'</div></div>';
  });
  h+='</div>';
  var allPlaced=b.chips.every(function(c){return st.place[c.id]&&st.place[c.id]!=="pool";});
  h+='<div class="row"><button class="btn" data-act="check" data-id="'+b.id+'"'+(allPlaced?"":" disabled")+'>Check my answers</button><button class="btn alt" data-act="reset" data-id="'+b.id+'">Start over</button>';
  if(st.checked){
    var msg=st.score+" of "+b.chips.length+" correct."+(st.score<b.chips.length?" Move the red cards and check again.":" Great work!");
    h+='<span class="result">'+esc(msg)+'</span>'+spk(msg,"sm");
  }else if(!allPlaced){h+='<span class="hintline">Place every card to check.</span>';}
  h+='</div>';
  if(st.checked&&st.score===b.chips.length&&b.after){h+='<div class="fb ok"><p>'+esc(b.after)+'</p>'+spk(b.after,"sm")+'</div>';}
  return h+'</div>';
}

function fieldHTML(f){

function writeInner(b){

function pollInner(b){

function rateInner(b){

function taskHTML(t){
  var h='<div class="tk" style="--tc:var(--c'+t.id+')">'
    +'<div class="banner"><span class="bigic" aria-hidden="true">'+t.icon+'</span><h2>Stop '+t.id+': '+esc(t.title)+'</h2></div>'
    +'<div class="card"><div class="lead"><p>'+esc(t.intro)+'</p>'+spk("Stop "+t.id+". "+t.title+". "+t.intro)+'</div><div class="hp">🎧 Headphones on before you press 🔊.</div></div>';
  var group="";
  function flush(){if(group){h+='<div class="card">'+group+'</div>';group="";}}
  t.blocks.forEach(function(b){
    if(b.type==="ref"){flush();h+=refHTML(b);}
    else if(b.type==="poem"){flush();h+=poemHTML();}
    else if(b.type==="passage"){flush();h+=passageHTML(b.key);}
    else if(b.type==="ads"){flush();h+=adsHTML();}
    else if(b.type==="text"){flush();h+=textHTML(b);}
    else if(b.type==="mc"){group+=mcInner(b);}
    else if(b.type==="drag"){group+=dragInner(b);}
    else if(b.type==="write"){group+=writeInner(b);}
    else if(b.type==="rate"){group+=rateInner(b);}
    else if(b.type==="poll"){group+=pollInner(b);}
  });
  flush();
  return h+'</div>';
}

/* ---------- results ---------- */
function scoreSummary(){
  var tot=0,max=0,rows=[];
  TASKS.forEach(function(t){
    var p=0,m=0;
    autoItems(t).forEach(function(b){p+=ptsOf(b);m+=maxOf(b);});
    tot+=p;max+=m;
    if(m)rows.push({t:t,p:p,m:m});
  });
  return {tot:tot,max:max,rows:rows};
}
function writtenList(){
  var out=[];
  TASKS.forEach(function(t){
    t.blocks.forEach(function(b){
      if(b.type==="write"){
        b.fields.forEach(function(f){out.push({task:t.title,label:f.label,text:S.writes[f.id]||"",challenge:!!b.challenge});});
      }else if(b.type==="poll"){
        var pr=S.writes[b.id];out.push({task:t.title,label:b.q,text:(pr!==undefined&&pr!=="")?b.opts[parseInt(pr,10)]:"",challenge:false});
      }else if(b.type==="rate"){
        var r=S.writes[b.id];out.push({task:t.title,label:b.q,text:r?b.labels[r-1]:"",challenge:false});
      }
    });
  });
  return out;
}
function rankOf(pct){
  if(pct>=90)return "Trail Legend 🏆";
  if(pct>=75)return "Summit Explorer 🧭";
  if(pct>=55)return "Trailblazer 🔥";
  return "Rising Scout 🌱";
}
function medalsHTML(){
  var defs=[
    {n:"Root Master",i:"🌱",c:"var(--c1)",ok:fullTask("roots")},
    {n:"Poetry Pro",i:"🌳",c:"var(--c2)",ok:fullTask("poem")},
    {n:"Main Idea Hunter",i:"🎯",c:"var(--c3)",ok:fullTask("main")},
    {n:"Inference Ace",i:"🕵️",c:"var(--c6)",ok:fullTask("infer")},
    {n:"Field Scientist",i:"🔬",c:"var(--c8)",ok:fullTask("science")},
    {n:"Game Champ",i:"🎮",c:"var(--c1)",ok:bonusTotal()>=400},
    {n:"Persuasion Detective",i:"🔎",c:"var(--c7)",ok:fullTask("persuade")},
    {n:"Paragraph Architect",i:"🏗️",c:"var(--c4)",ok:fullTask("write")},
    {n:"Wordsmith",i:"✍️",c:"var(--c5)",ok:allWritten()},
    {n:"Challenge Accepted",i:"🚀",c:"var(--c3)",ok:anyChallenge()}
  ];
  return '<div class="medals">'+defs.map(function(d){
    return '<div class="medal'+(d.ok?'':' off')+'"'+(d.ok?' style="background:'+d.c+'"':'')+'><span aria-hidden="true">'+(d.ok?d.i:'🔒')+'</span>'+esc(d.n)+'</div>';
  }).join('')+'</div>';
}
function fullTask(key){
  var t=TASKS.filter(function(k){return k.key===key;})[0],p=0,m=0;
  autoItems(t).forEach(function(b){p+=ptsOf(b);m+=maxOf(b);});
  return m>0&&p===m;
}
function allWritten(){
  var ok=true,any=false;
  TASKS.forEach(function(t){t.blocks.forEach(function(b){if(b.type==="write"&&!b.challenge){b.fields.forEach(function(f){any=true;if(words(S.writes[f.id])<2)ok=false;});}});});
  return any&&ok;
}
function anyChallenge(){
  var yes=false;
  TASKS.forEach(function(t){t.blocks.forEach(function(b){if(b.type==="write"&&b.challenge){b.fields.forEach(function(f){if(words(S.writes[f.id])>=3)yes=true;});}});});
  return yes;
}
function resultsHTML(){
  var sc=scoreSummary();
  var pct=sc.max?Math.round(sc.tot/sc.max*100):0;
  var h='<section class="hero" style="background:var(--c5)"><div class="emo" aria-hidden="true">🏆 ⭐ 🎉</div><h1>Trail complete, '+esc(S.name||"explorer")+'!</h1><p>Class period: '+esc(S.period||"not entered")+'</p></section>'
    +'<div class="card"><div class="lead"><div style="flex:1"><div class="big">'+sc.tot+' / '+sc.max+'</div><p style="margin:6px 0 0">auto-scored points ('+pct+'%). Your teacher will score your written responses.</p><p class="rank" style="margin:8px 0 0">Your rank: '+esc(rankOf(pct))+'</p></div>'+spk("You earned "+sc.tot+" out of "+sc.max+" points on the checked questions. Your rank is "+rankOf(pct).replace(/[^\w\s]/g,"")+". Your teacher will score your written responses.")+'</div>'
    +'<table class="rtable">'+sc.rows.map(function(r){return '<tr><td>Stop '+r.t.id+': '+esc(r.t.title)+'</td><td>'+r.p+' / '+r.m+'</td></tr>';}).join('')+'</table></div>';
  h+='<div class="card"><h3>Badges</h3>'+medalsHTML()+'</div>';
  h+='<div class="card"><h3>Bonus rounds: '+bonusTotal()+' points</h3><table class="rtable">';
  TASKS.forEach(function(t,i){
    var g=GAMES[t.key],r=(S.games||{})[t.key];
    h+='<tr class="brow"><td>'+esc(g.title)+'</td><td>'+(r&&r.best?r.best+' pts':'not played')+'</td><td><button class="btn alt noprint" style="min-height:42px;padding:2px 14px" data-act="gopen" data-i="'+i+'">'+(r&&r.best?'Play again':'Play')+'</button></td></tr>';
  });
  h+='</table></div>';
  h+='<div class="card noprint"><h3>Turn it in</h3><p>Press <strong>Copy my results</strong> and paste them into the Canvas assignment, or take a screenshot of this page. Then stay quiet until the bell.</p>'
    +'<div class="row"><button class="btn" data-act="copy">Copy my results</button><button class="btn alt" data-act="print">Print or save as PDF</button><span class="hintline" id="copyMsg"></span></div>'
    +'<textarea id="copyBox" rows="6" style="display:none" readonly aria-label="Your results"></textarea></div>';
  h+='<div class="card"><h3>My written answers</h3>';
  var lastTask="";
  writtenList().forEach(function(w){
    if(w.task!==lastTask){h+='<p><strong>'+esc(w.task)+'</strong></p>';lastTask=w.task;}
    h+='<div><em>'+esc(w.label)+'</em></div><div class="answer">'+(w.text?esc(w.text):'<span class="hintline">(blank)</span>')+'</div>';
  });
  return h+'</div>';
}
function resultsText(){
  var sc=scoreSummary();
  var t="Name: "+S.name+"\nPeriod: "+S.period+"\nAuto-scored points: "+sc.tot+" / "+sc.max+"\n";
  sc.rows.forEach(function(r){t+="  Stop "+r.t.id+" "+r.t.title+": "+r.p+" / "+r.m+"\n";});
  t+="Bonus game points: "+bonusTotal()+"\n";
  t+="\nWRITTEN RESPONSES\n";
  var last="";
  writtenList().forEach(function(w){
    if(w.task!==last){t+="\n== "+w.task+" ==\n";last=w.task;}
    t+=w.label+"\n"+(w.text||"(blank)")+"\n\n";
  });
  return t;
}

function xpNow(){
  var sc=scoreSummary(),n=sc.tot*10;
  Object.keys(S.writes).forEach(function(k){if(words(S.writes[k])>=3)n+=5;});
  return n+bonusTotal();

function updateChrome(){
  var x=$("#xpn");if(x)x.textContent=xpNow();
  $("#xp").hidden=!S.started;
  $("#saved").hidden=!S.started;
  var f=$("#progfill");
  if(f){var frac=S.task<0?0:Math.min(1,(S.task+0.15)/TASKS.length);f.style.width=Math.round(frac*100)+"%";}
}
var CHEER_OK=["Nailed it!","Boom!","Great thinking!","You got it!","Sharp!","Yes!"];
var CHEER_NO=["Close!","Almost!","Good try!","Not this time."];
function cheer(id,ok){
  var n=0;for(var i=0;i<id.length;i++)n+=id.charCodeAt(i);
  var a=ok?CHEER_OK:CHEER_NO;return a[n%a.length];
}
function burst(){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var cols=["#7ED957","#4DB6FF","#FF7A7A","#B496FF","#FFC83D"];
  var cx=window.innerWidth/2,cy=window.innerHeight*0.35;
  for(var i=0;i<28;i++){
    var d=document.createElement("span");d.className="confetti";
    d.style.left=cx+"px";d.style.top=cy+"px";d.style.background=cols[i%cols.length];
    var ang=Math.random()*Math.PI*2,dist=90+Math.random()*190;
    d.style.setProperty("--dx",Math.cos(ang)*dist+"px");
    d.style.setProperty("--dy",(Math.sin(ang)*dist+90)+"px");
    d.style.setProperty("--rot",(Math.random()*720-360)+"deg");
    document.body.appendChild(d);
    (function(el){setTimeout(function(){el.remove();},1200);})(d);
  }
}
function render(keepScroll){
  var y=window.scrollY;
  $("#trail").innerHTML=trailHTML();
  var st=stageEl();
  if(inGame)st.innerHTML=gameScreen(inGame.i);
  else if(S.task<0)st.innerHTML=startHTML();
  else if(S.task>=TASKS.length)st.innerHTML=resultsHTML();
  else st.innerHTML=taskHTML(TASKS[S.task]);
  var bar=$("#bar");
  bar.hidden=S.task<0||!!inGame;
  if(S.task>=0){
    $("#backBtn").textContent=S.task===0?"Back to start":"Back";
    $("#backBtn").style.visibility=S.task>=TASKS.length?"visible":"visible";
    $("#nextBtn").textContent=S.task>=TASKS.length?"Back to my work":(S.task===TASKS.length-1?"See my results":"Next stop");
    $("#nextBtn").style.display="";
  }

}
function go(i){

/* ---------- drag and drop ---------- */
var sel=null,drag=null;
function itemDef(id){
  for(var i=0;i<TASKS.length;i++){var bs=TASKS[i].blocks;for(var j=0;j<bs.length;j++){if(bs[j].id===id)return bs[j];}}
  return null;
}
function moveChip(itemId,chipId,zoneId){
  var b=itemDef(itemId),st=S.items[itemId];
  if(!b||!st)return;
  if(zoneId!=="pool"){
    var inZone=b.chips.filter(function(c){return st.place[c.id]===zoneId&&c.id!==chipId;});
    if(b.cap&&inZone.length>=b.cap){inZone.forEach(function(c){st.place[c.id]="pool";});}
  }
  st.place[chipId]=zoneId;
  st.checked=false;
  sel=null;save();render(true);
}
function zoneAt(x,y,itemId){
  var el=document.elementFromPoint(x,y);
  var z=el&&el.closest?el.closest("[data-zone]"):null;
  return (z&&z.dataset.item===itemId)?z:null;
}
function clearHot(){var hs=document.querySelectorAll(".hot");for(var i=0;i<hs.length;i++)hs[i].classList.remove("hot");}

document.addEventListener("pointerdown",function(e){
  var chip=e.target.closest&&e.target.closest(".chip");
  if(!chip||e.target.closest(".spk"))return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  drag={chip:chip,item:chip.dataset.item,id:chip.dataset.chip,x:e.clientX,y:e.clientY,moved:false,ghost:null,pid:e.pointerId};
  try{chip.setPointerCapture(e.pointerId);}catch(err){}
});
document.addEventListener("pointermove",function(e){
  if(!drag||e.pointerId!==drag.pid)return;
  var dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved&&Math.sqrt(dx*dx+dy*dy)>8){
    drag.moved=true;
    var g=drag.chip.cloneNode(true);
    g.classList.add("ghost");g.classList.remove("sel");
    g.style.width=Math.min(drag.chip.offsetWidth,320)+"px";
    var sp=g.querySelector(".spk");if(sp)sp.remove();
    g.style.setProperty("--tc",getComputedStyle(drag.chip).getPropertyValue("--tc")||"#FFC83D");
    document.body.appendChild(g);drag.ghost=g;
    drag.chip.classList.add("dragging");
  }
  if(drag.moved){
    e.preventDefault();
    drag.ghost.style.left=e.clientX+"px";drag.ghost.style.top=e.clientY+"px";
    clearHot();
    var z=zoneAt(e.clientX,e.clientY,drag.item);
    if(z)z.classList.add("hot");
  }
});
function endDrag(e,cancel){
  if(!drag||e.pointerId!==drag.pid)return;
  var d=drag;drag=null;
  clearHot();
  if(d.ghost)d.ghost.remove();
  if(d.moved){
    d.chip.classList.remove("dragging");
    if(!cancel){
      var z=zoneAt(e.clientX,e.clientY,d.item);
      if(z)moveChip(d.item,d.id,z.dataset.zone);
    }
  }else if(!cancel){
    if(sel&&sel.item===d.item&&sel.chip===d.id){sel=null;}
    else{sel={item:d.item,chip:d.id};}
    render(true);
  }
}
document.addEventListener("pointerup",function(e){endDrag(e,false);});
document.addEventListener("pointercancel",function(e){endDrag(e,true);});

/* ---------- clicks ---------- */
document.addEventListener("click",function(e){
  var sp=e.target.closest&&e.target.closest(".spk");
  if(sp){speak(sp.getAttribute("data-say"),sp);return;}
  var gg=e.target.closest&&e.target.closest("[data-g]");
  if(gg&&inGame&&inGame.running){ENG[inGame.cfg.mode].click(inGame,gg.getAttribute("data-g"),gg);return;}
  var a=e.target.closest&&e.target.closest("[data-act]");
  if(a){
    var act=a.dataset.act;
    if(act==="start"){
      if(!S.name.trim()){var m=$("#startMsg");if(m)m.textContent="Type your name first.";var n=$("#nm");if(n)n.focus();return;}
      if(!S.started)S.started=Date.now();
      go(0);return;
    }
    if(act==="goto"){go(parseInt(a.dataset.i,10));return;}
    if(act==="next"){
      if(S.task>=TASKS.length){go(TASKS.length-1);return;}
      var tk=TASKS[S.task];
      if(tk&&GAMES[tk.key]&&!(S.games&&S.games[tk.key])){openGame(S.task);return;}
      go(S.task+1);return;
    }
    if(act==="back"){go(S.task===0?-1:S.task-1);return;}
    if(act==="mc"){
      var id=a.dataset.id;
      if(S.items[id]&&S.items[id].pick!==undefined)return;
      var pk=parseInt(a.dataset.i,10);S.items[id]={pick:pk};save();render(true);if(pk===itemDef(id).ans)burst();return;
    }
    if(act==="check"){
      var b=itemDef(a.dataset.id),st=S.items[b.id],n=0;
      b.chips.forEach(function(c){if(st.place[c.id]===c.zone)n++;});
      st.checked=true;st.score=n;sel=null;save();render(true);if(n===b.chips.length)burst();return;
    }
    if(act==="reset"){S.items[a.dataset.id]={place:{},checked:false,score:0};sel=null;save();render(true);return;}
    if(act==="gplay"){startRun();return;}
    if(act==="gskip"||act==="gcont"){leaveGame();return;}
    if(act==="gopen"){openGame(parseInt(a.dataset.i,10),TASKS.length);return;}
    if(act==="poll"){S.writes[a.dataset.id]=a.dataset.i;save();render(true);return;}
    if(act==="rate"){S.writes[a.dataset.id]=a.dataset.i;save();render(true);return;}
    if(act==="fresh"){confirmFresh=true;render(true);return;}
    if(act==="fresh-no"){confirmFresh=false;render(true);return;}
    if(act==="fresh-yes"){
      confirmFresh=false;inGame=null;
      try{localStorage.removeItem(KEY);}catch(err){}
      try{if(idb)idb.transaction("s","readwrite").objectStore("s").delete(KEY);}catch(err){}
      S={name:"",period:"",started:0,task:-1,items:{},writes:{},games:{}};
      save();render(false);window.scrollTo(0,0);
      return;
    }
    if(act==="print"){window.print();return;}
    if(act==="copy"){
      var txt=resultsText(),msg=$("#copyMsg"),box=$("#copyBox");
      function fallback(){box.style.display="block";box.value=txt;box.focus();box.select();if(msg)msg.textContent="Press and hold the box, choose Select All, then Copy.";}
      try{
        if(navigator.clipboard&&navigator.clipboard.writeText){
          navigator.clipboard.writeText(txt).then(function(){if(msg)msg.textContent="Copied! Paste it into Canvas.";},fallback);
        }else{fallback();}
      }catch(err){fallback();}
      return;
    }
    return;
  }
  /* tap-to-place: a chip is selected and a zone is tapped */
  if(sel){
    var z=e.target.closest&&e.target.closest("[data-zone]");
    if(z&&z.dataset.item===sel.item&&!(e.target.closest&&e.target.closest(".chip"))){
      moveChip(sel.item,sel.chip,z.dataset.zone);
    }
  }
});

    var q=G.cfg.qs[G.i];G.lock=false;
    G.order=shuffle(q.o.map(function(_,i){return i;}));
    setInfo(hearts(G.hearts,3));
    var h='<div class="boss"><span class="bossic" aria-hidden="true">'+G.cfg.boss+'</span><div style="flex:1"><b>'+esc(G.cfg.name)+'</b><div class="hpbar"><div style="width:'+Math.round(G.hp/G.n*100)+'%"></div></div></div></div>'
      +'<div class="qhead"><p class="qtext">'+esc(q.q)+'</p>'+spk(q.q+" "+q.o.join(". "))+'</div><div class="opts">';
    G.order.forEach(function(oi){h+='<div class="orow"><button type="button" class="opt" data-g="ans" data-oi="'+oi+'">'+esc(q.o[oi])+'</button>'+spk(q.o[oi],"sm")+'</div>';});
    $("#garea").innerHTML=h+'</div><div class="gfb" id="gfb"></div>';
  },
  click:function(G,act,el){
    if(act!=="ans"||G.lock)return;
    G.lock=true;
    var q=G.cfg.qs[G.i],oi=parseInt(el.getAttribute("data-oi"),10),ok=(oi===q.a),f=$("#gfb");
    var btns=document.querySelectorAll('#garea [data-g="ans"]');
    for(var k=0;k<btns.length;k++){if(parseInt(btns[k].getAttribute("data-oi"),10)===q.a)btns[k].classList.add("right");btns[k].disabled=true;}
    if(ok){
      G.hp--;setScore(G,G.pts);f.textContent="💥 Direct hit! "+q.why;
    }else{
      el.classList.add("wrong");G.hearts--;setInfo(hearts(G.hearts,3));f.textContent="Ouch! "+q.why;
    }
    later(G,ok?1400:2200,function(){
      if(G.hearts<=0){finishGame(G,"The boss got you this time. Great effort!");return;}
      G.i++;
      if(G.i>=G.n){finishGame(G,G.hp<=0?"Boss defeated!":"You made it through the battle!");}
      else ENG.boss.show(G);
    });
  }
 },
 memory:{
  start:function(G){
    var cards=[];
    G.cfg.pairs.forEach(function(p,i){cards.push({id:i,t:p.c,s:"down"});cards.push({id:i,t:p.i,s:"down"});});
    G.cards=shuffle(cards);G.open=[];G.miss=0;G.matched=0;
    setInfo("Misses: 0");
    this.draw(G);
  },
  draw:function(G){
    var h='<div class="mem">';
    G.cards.forEach(function(c,i){
      if(c.s==="down")h+='<button type="button" class="mcard" data-g="flip" data-i="'+i+'" aria-label="Face-down card">?</button>';
      else h+='<div class="mcard '+c.s+'" data-g="flip" data-i="'+i+'"><span>'+esc(c.t)+'</span>'+spk(c.t,"sm")+'</div>';
    });
    $("#garea").innerHTML=h+'</div><div class="gfb" id="gfb"></div>';
  },
  click:function(G,act,el){
    if(act!=="flip"||G.lock)return;
    var i=parseInt(el.getAttribute("data-i"),10),c=G.cards[i];
    if(c.s!=="down")return;
    c.s="up";G.open.push(i);this.draw(G);
    if(G.open.length===2){
      G.lock=true;
      var a=G.cards[G.open[0]],b=G.cards[G.open[1]];
      if(a.id===b.id){
        a.s="done";b.s="done";G.matched++;G.open=[];G.lock=false;this.draw(G);
        $("#gfb").textContent="✅ Match!";
        if(G.matched>=G.cfg.pairs.length){
          G.score=0;setScore(G,Math.max(40,100-5*G.miss));
          later(G,900,function(){finishGame(G,G.miss===0?"Perfect memory!":"All pairs matched!");});
        }
      }else{
        G.miss++;setInfo("Misses: "+G.miss);
        $("#gfb").textContent="Not a match. Remember where they are!";
        later(G,1400,function(){a.s="down";b.s="down";G.open=[];G.lock=false;ENG.memory.draw(G);});
      }
    }
  }
 },
 scramble:{
  start:function(G){G.w=0;G.n=G.cfg.words.length;G.pts=Math.round(100/G.n);this.show(G);},
  show:function(G){
    var W=G.cfg.words[G.w];G.lock=false;G.tries=0;G.ans=[];
    var letters=W.w.split("");
    var sc=letters;var guard=0;
    do{sc=shuffle(letters);guard++;}while(sc.join("")===W.w&&guard<20);
    G.tiles=sc.map(function(l){return {l:l,used:false};});
    setInfo("Word "+(G.w+1)+" of "+G.n);
    this.draw(G);
  },
  draw:function(G){
    var W=G.cfg.words[G.w];
    var h='<div class="gprompt"><span>Hint: '+esc(W.h)+'</span>'+spk("Hint. "+W.h,"sm")+'</div><div class="slots">';
    for(var i=0;i<W.w.length;i++){h+='<div class="slot">'+(G.ans[i]?esc(G.ans[i].l):"")+'</div>';}
    h+='</div><div class="tiles">';
    G.tiles.forEach(function(t,i){h+='<button type="button" class="tile" data-g="tile" data-i="'+i+'"'+(t.used?" disabled":"")+'>'+esc(t.l)+'</button>';});
    h+='</div><div class="row" style="justify-content:center"><button type="button" class="btn alt" data-g="undo">Undo</button><button type="button" class="btn alt" data-g="clear">Clear</button></div><div class="gfb" id="gfb" style="text-align:center"></div>';
    $("#garea").innerHTML=h;
  },
  click:function(G,act,el){
    if(G.lock)return;
    var W=G.cfg.words[G.w];
    if(act==="undo"){var u=G.ans.pop();if(u)u.used=false;this.draw(G);return;}
    if(act==="clear"){G.ans.forEach(function(t){t.used=false;});G.ans=[];this.draw(G);return;}
    if(act!=="tile")return;
    var t=G.tiles[parseInt(el.getAttribute("data-i"),10)];
    if(!t||t.used)return;
    t.used=true;G.ans.push(t);
    if(G.ans.length<W.w.length){this.draw(G);return;}
    var guess=G.ans.map(function(x){return x.l;}).join("");
    if(guess===W.w){
      G.lock=true;
      var add=G.tries===0?G.pts:(G.tries===1?Math.round(G.pts*0.6):Math.round(G.pts*0.3));
      setScore(G,add);this.draw(G);
      $("#gfb").textContent="✅ "+W.w.charAt(0)+W.w.slice(1).toLowerCase()+"! +"+add;
      later(G,1000,function(){G.w++;if(G.w>=G.n)finishGame(G,"All words unscrambled!");else ENG.scramble.show(G);});
    }else{
      G.tries++;
      G.ans.forEach(function(x){x.used=false;});G.ans=[];
      this.draw(G);
      $("#gfb").textContent="Not quite. Try again!";
      if(G.tries>=3){
        G.lock=true;$("#gfb").textContent="The word was "+W.w.charAt(0)+W.w.slice(1).toLowerCase()+". On to the next one!";
        later(G,1600,function(){G.w++;if(G.w>=G.n)finishGame(G,"Nice effort!");else ENG.scramble.show(G);});
      }
    }
  }
 }
};

/* ---------- boot ---------- */
if(S.task>=0&&!S.started){S.task=-1;}
render(false);
bootStorage();
})();
</script>
